# Workspace root. Not a package itself: it holds the shared developer tooling and
# the configuration every member package inherits.
[project]
name = "flocklake-workspace"
version = "0.0.0"
description = "Workspace root for the FlockLake packages"
requires-python = ">=3.13"
license = "MIT"

[tool.uv]
package = false
required-version = ">=0.11.21"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
flocklake-core = { workspace = true }

[dependency-groups]
dev = [
    "flocklake-core",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# --- Lint and format ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
# Start from everything and switch off only what conflicts or does not fit.
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas are the formatter's job
    "ISC001",  # conflicts with the formatter
    "CPY001",  # no copyright header per file; the LICENSE covers it
    "TD002",   # TODOs do not need an author
    "TD003",   # TODOs link to issues where useful, not always
    "FIX002",  # TODOs are allowed; they are tracked as issues
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",     # assert is how pytest tests
    "PLR2004",  # literal expected values are clearer in tests
    "D100",     # test modules do not need module docstrings
    "D101",     # test classes group tests; their names say what
    "D102",     # test names describe the behaviour under test
    "D103",
    "D104",
    "INP001",   # test directories are not packages
]
"conftest.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# --- Types --------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "redundant-self",
]
files = ["conftest.py", "packages/flocklake-core/src", "packages/flocklake-core/tests"]
mypy_path = "packages/flocklake-core/src"
explicit_package_bases = true

# --- Tests --------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--doctest-modules",
    "-ra",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: fast, isolated tests with no services (the default kind)",
    "integration: needs services such as PostgreSQL or the object store",
    "e2e: runs data end to end through the platform",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source_pkgs = ["flocklake_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
