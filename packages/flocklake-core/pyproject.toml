[project]
name = "flocklake-core"
version = "0.0.1"
description = "Radar aeroecology physics and data formats for FlockLake: reflectivity, bird density, profile integration, night calendars"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Soheil Mohammadpour" }]
keywords = ["weather radar", "bird migration", "aeroecology", "vertical profiles", "ODIM"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2",
]

[project.urls]
Homepage = "https://github.com/soheil-mp/flocklake"
Issues = "https://github.com/soheil-mp/flocklake/issues"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
