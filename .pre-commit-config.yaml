# Run `pre-commit install` once after cloning. Hooks run on every commit;
# CI runs the same hooks with `pre-commit run --all-files`.
# More hooks (ruff, mypy, sqlfluff, hadolint, actionlint, commit-msg checks)
# arrive with the code they check; see ROADMAP.md, milestone M0.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
